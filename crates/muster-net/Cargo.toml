[package]
name = "muster-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log = { workspace = true }

# The one thing `std` cannot do and this engine needs: `SO_REUSEADDR` set
# *before* a bind. `listen.rs` shares port 5353 with the machine's own mDNS
# responder and 1900 with its SSDP service, which is only possible with that
# option, and `std::net::UdpSocket::bind` binds before anything can be set on
# it. The alternative was two hundred lines of platform-specific `unsafe`
# socket setup, of which only the half that runs on the developer's machine
# could be tested. socket2 is the crate the ecosystem uses for exactly this,
# and it pulls in nothing that is not already here.
socket2 = { version = "0.6", features = ["all"] }

# The OS readings on Linux: `getifaddrs` for the interface list, and the
# netlink socket for routes and neighbours. Everything else on this platform is
# `/proc` and `/etc`, which is plain file reading and needs no crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The OS readings on Windows, all of them out of the IP Helper API. None of
# these calls needs elevation, which is what makes the unprivileged engine as
# capable as `CLAUDE.md` claims:
#
#   GetAdaptersAddresses  interfaces, MACs, addresses, prefixes, DNS servers,
#                         and the DHCP server the lease came from
#   GetIpForwardTable2    the routing table, and so the default gateway
#   GetIpNetTable2        the neighbour (ARP/NDP) table
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }
